# orbit.ignat.ai on Cloudflare Workers: static assets only, no Worker script.
# Deployed by .github/workflows/update-and-deploy.yml after `pnpm build`.
name = "ephemeris"
compatibility_date = "2026-09-25"
# Only the custom domain: no workers.dev or preview URLs.
workers_dev = false
preview_urls = false

# The custom domain creates its own DNS record on the first deploy; the zone
# must not already have a record for orbit.ignat.ai.
routes = [{ pattern = "orbit.ignat.ai", custom_domain = true }]

[assets]
directory = "./dist"
